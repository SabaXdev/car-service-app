<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Car Service Orders</title>
  <script
    id="sap-ui-bootstrap"
    src="https://ui5.sap.com/1.120.33/resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-resourceroots='{"serviceorders": "./"}'
    data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
    data-sap-ui-compatVersion="edge"
    data-sap-ui-async="true"
    data-sap-ui-frameOptions="trusted"
    data-sap-ui-xx-bindingSyntax="complex"
    data-sap-ui-language="en"
    data-sap-ui-xx-componentPreload="off"
    data-sap-ui-flexibilityServices='[{"connector": "LocalStorageConnector"}]'
  ></script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
  <h1>Hello World</h1>
  <div
    data-sap-ui-component
    data-name="serviceorders"
    data-id="container"
    data-settings='{"id": "serviceorders"}'
  ></div>

</html>
